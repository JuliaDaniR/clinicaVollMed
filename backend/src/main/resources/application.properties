spring.application.name=api

# ==============================
# DATABASE (usa variables de entorno con fallbacks locales)
# ==============================
spring.datasource.url=${VOLLMED_DB_URL:jdbc:mysql://localhost:3306/vollmed-api?createDatabaseIfNotExist=true}
spring.datasource.username=${VOLLMED_DB_USER:root}
spring.datasource.password=${VOLLMED_DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=ERROR

# ==============================
# FLYWAY
# ==============================
spring.flyway.enabled=true
spring.flyway.url=${VOLLMED_DB_URL:jdbc:mysql://localhost:3306/vollmed-api?createDatabaseIfNotExist=true}
spring.flyway.user=${VOLLMED_DB_USER:root}
spring.flyway.password=${VOLLMED_DB_PASS:}

# ==============================
# SECURITY / JWT
# ==============================
api.security.secret=${JWT_SECRET:97482374892374892374982374892374892374892374982374892374892374}

# ==============================
# MAILTRAP
# ==============================
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USER:}
spring.mail.password=${MAILTRAP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.from=noreply@vollmed.test


# ==============================
# PROFILE
# ==============================
spring.profiles.active=dev

# ==============================
# CORS
# ==============================
# En producción (Render), pon la URL de tu Static Site separada por coma si hay más de una
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

# OpenRouter (Modelos Gratuitos con mayor cuota)
openrouter.api-key=${OPENROUTER_API_KEY:mock-key-for-tests}
openrouter.url=https://openrouter.ai/api/v1/chat/completions
openrouter.models=poolside/laguna-xs.2:free,nvidia/nemotron-3-nano-30b-a3b:free,deepseek/deepseek-r1:free,openrouter/auto

# Google Gemini (Modelos Confiables)
gemini.base-url=https://generativelanguage.googleapis.com
gemini.api-key=${GEMINI_API_KEY:mock-key-for-tests}
gemini.models=gemini-3.5-flash,gemini-3.1-pro,gemini-3.1-flash-lite,gemini-3-flash,gemini-2.0-flash,gemini-2.0-flash-lite
